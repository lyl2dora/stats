name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # there is no .env on the runner, the Makefile falls back to the environment
      ENV_FILE: /nonexistent

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # MARKETING_VERSION is the single source of truth: the updater compares the release tag
      # against it, so a mismatch would ship an update the app never offers, or offers forever.
      # On a tag the two have to agree, on a manual run the tag is derived from it.
      - name: Resolve the release tag
        run: |
          declared=$(/usr/libexec/PlistBuddy -c "print :objects:9A141107229E721200D29793:buildSettings:MARKETING_VERSION" Stats.xcodeproj/project.pbxproj)
          echo "declared=$declared"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag"
            if [ "$tag" != "$declared" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $declared"
              exit 1
            fi
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$declared" >> "$GITHUB_ENV"
          fi

      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$CSC_LINK" | tr -d '\r' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # without this codesign would need an interactive prompt it cannot get
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$keychain"

      # Keeps the build number monotonic so PluginKit picks up the new widget.
      - name: Stamp the build number
        run: |
          build=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "Stats/Supporting Files/Info.plist"
          echo "build number: $build"

      - name: Archive
        run: make archive

      - name: Notarize and staple
        run: make notarize sign verify

      - name: Build the disk image
        run: make prepare-dmg sign-dmg

      # A manual run releases too. The tag does not exist yet in that case, so it is cut at the
      # commit that was built. An already released version fails here instead of shipping twice.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" Stats.dmg \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
